name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails on any external URL in the README that doesn't end up at a 2xx/3xx.
      # Catches things like the trophy host returning 402 before someone notices.
      - name: Check external URLs in README.md
        run: |
          failed=0
          while read -r url; do
            code=$(curl -sL -o /dev/null -m 30 --retry 2 -w '%{http_code}' "$url") || code=000
            if [ "$code" = "000" ] || [ "$code" -ge 400 ]; then
              echo "::error file=README.md::$code $url"
              failed=1
            fi
          done < <(grep -oE 'https?://[^])"[:space:]<]+' README.md | sort -u)
          exit "$failed"
